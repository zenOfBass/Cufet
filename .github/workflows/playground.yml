# Builds the Cufet playground and publishes it to GitHub Pages.
#
# The site is entirely static — the interpreter is compiled to WebAssembly and runs in the
# visitor's browser, so there is nothing to host but files. That is deliberate: Cufet can spawn
# subprocesses and touch the filesystem, and running strangers' programs on a server would be a
# real security hole rather than a theoretical one.
#
# Repository setting required once, by hand: Settings → Pages → Build and deployment →
# Source: "GitHub Actions". Without it this workflow builds happily and deploys nowhere.

name: Playground

on:
  push:
    branches: [main]
    # No `paths:` filter, deliberately. There was one — it listed the playground, the lexer, the
    # interpreter and the grammar — and it left out `tests/`, so a commit that fixed the tests this
    # workflow gates on did not trigger the workflow. Nothing ran, nothing said why, and the site
    # silently stayed as it was. A filter that skips a run is indistinguishable from a filter that
    # works, which makes it a bad trade for the couple of minutes it saves.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, and never cancel one midway: a half-published Pages site is worse than
# an out-of-date one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    name: Front end
    runs-on: ubuntu-latest
    # ★ These tests take SECONDS. Ten minutes is not a budget, it is a tripwire.
    #
    # A fault that makes a test hang does not fail the run — it wedges it, and GitHub's default
    # job limit is SIX HOURS. That is not hypothetical: a one-word change to void equality
    # (`return true` → `return false` in ValuesEqual) put a test into a loop that never ended and
    # cost two hours locally before anyone looked. A per-test timeout would be better, but xUnit
    # 2.4.2 has no global default for one and cannot free a synchronously blocked thread anyway,
    # so the wall clock is where this belongs.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Lexer and interpreter only. They are the code the playground actually ships, they need
      # no gcc, and they finish in seconds — so this gates the deploy without slowing it down.
      # The compiler suite is deliberately not run here; see the note at the bottom of this file.
      - name: Test the lexer
        run: dotnet test tests/Lexer.Tests/Cufet.Lexer.Tests.csproj --nologo

      - name: Test the interpreter
        run: dotnet test tests/Interpreter.Tests/Cufet.Interpreter.Tests.csproj --nologo

  build:
    name: Build the site
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Required for the browser-wasm runtime identifier. Without it, publish fails with a
      # message about a missing workload rather than anything about WebAssembly.
      - name: Install the wasm workload
        run: dotnet workload install wasm-tools

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: playground/package-lock.json

      # `ci`, not `install` — it installs exactly the versions in the lockfile and fails if the
      # lockfile and package.json disagree, so a deploy cannot quietly pick up a different Monaco.
      - name: Install the page's dependencies
        working-directory: playground
        run: npm ci

      # InvariantGlobalization is ON now, in the csproj rather than here — CI and a local build
      # do the same thing, which is the point. The note that used to sit here estimated it would
      # save "roughly 200 KB of ICU data"; measured, it takes 1.52 MB off the COMPRESSED download,
      # 35% of it, because linking ICU out shrinks the native runtime as well as dropping the two
      # .dat files. It was also the safer setting, not a trade: see the csproj.
      - name: Publish the interpreter to WebAssembly
        run: dotnet publish playground/Cufet.Playground.csproj -c Release

      - name: Assemble the site
        working-directory: playground
        run: node build.mjs --bundle=bin/Release/net10.0-browser/browser-wasm/AppBundle

      # ⚠ BEFORE the upload, so a page that cannot find the files its examples read is never
      # deployed. The seeding path fails silently by nature — nothing throws, the examples just go
      # back to reporting `not found`, which reads like the program's fault rather than the page's.
      # This drives the real wasm build under node, the same way the harness does locally.
      - name: Test the built playground
        working-directory: playground
        run: npm test

      - uses: actions/upload-pages-artifact@v3
        with:
          path: playground/site

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    # Publishing is a single action call; if it has not finished in ten minutes it is stuck, and
    # a stuck deploy holds the `pages` concurrency group and blocks every later one behind it.
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

# The full suite lives in full-suite.yml, deliberately not here.
#
# This workflow gates the Pages deploy, so it runs only the lexer and interpreter: they are the
# code the playground ships, they need no gcc, and they finish in seconds. The compiler suite is
# slower and its Linux-only tests are newly exercised, so a failure there must not stand between
# a fix and a published site.
